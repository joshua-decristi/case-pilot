[project]
name = "casepilot"
version = "0.1.0"
description = "Local portfolio demo: agent investigates synthetic stalled insurance cases"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx",
    "langchain",
    "langchain-openrouter",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casepilot"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["casepilot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_openrouter.*",
]
ignore_missing_imports = true
